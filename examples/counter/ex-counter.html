<script type="module">
    import { effect } from '@katabatic/signals'
    import './ex-counter-2.html'

    export class Counter extends HTMLElement {
        count = 0
        #test = 5

        connectedCallback() {
            const button = this.shadow.querySelector('button')

            effect(() => {
                button.style.color = this.count % 2 ? 'red' : 'blue'
            })
        }
    }

    customElements.define('ex-counter', Counter)
</script>

<template shadowRootMode="open">
    <ex-counter-2></ex-counter-2>
    {#if test}
    <button onclick="{count++}">counter is I {count} {test}</button>
    {/if}
    <style>
        :host {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        button {
            display: block;
            padding: 0.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
    </style>
</template>
