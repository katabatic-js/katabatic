<script type="module">
    import { effect } from '@katabatic/signals'
    import './ex-counter-2.html'

    export class Counter extends HTMLElement {
        count = 0
        #test = new Map()
        stuff

        connectedCallback() {
            const button = document.getElementById('hop')

            effect(() => {
                button.style.color = this.count % 2 ? 'red' : 'blue'
            })
        }
        print({ count }) {
            console.log(count)
            this.#test.set('aa', count)
        }

        getClass(a) {
            return a.active ? 'active' : '  '
            //return {active: a.active}
        }
    }

    customElements.define('ex-counter', Counter)
</script>

<template >
    <!-- comment -->
    <br/>
    {#if count >= 0}
    <input value="{count}" />
    <button id="hop" onclick="{count = count + 1}" class="active" hello="efe">counter is I {count} {test.get('aa')}</button>
    <button disabled="{count > 3 && count < 5 ? 'e' : 0}" class="{getClass({active: count > 5 && count < 7})}" style="{{fontWeight: count * 100}}" onclick="{print({count})}" hello="{`${stuff} h`}">efef {stuff}</button>

        <ex-counter-2></ex-counter-2>
    {/if}
        
    
        

    <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
    >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
<!-- comment -->
    <style>
        
        :host {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        ex-counter-2 {
            color: red;
        }

        button {
            display: block;
            padding: 0.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        button.active {
            color: red;
        }
    </style>
</template>
