<script type="module">
    import { effect } from '@katabatic/signals'
    import './ex-counter-2.html'

    export class Counter extends HTMLElement {
        count = 0
        #test = new Map()
        stuff

        connectedCallback() {
            const button = this.shadow.querySelector('button')

            effect(() => {
                button.style.color = this.count % 2 ? 'red' : 'blue'
            })
        }
        print({ count }) {
            console.log(count)
            this.#test.set('aa', count)
        }

        getClass(a) {
            return a.active ? 'active' : ''
        }
    }

    customElements.define('ex-counter', Counter)
</script>

<template shadowRootMode="open">
    <ex-counter-2></ex-counter-2>
    <!-- comment -->
    {#if test}
    <button onclick="{count++}" class="active" hello="efe">counter is I {count} {test.get('aa')}</button>
    <button class="{getClass({active: count > 5})}" onclick="{print({count})}" hello="{`${stuff} h`}">efef {stuff}</button>
    {/if}

    <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
    >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>

    <style>
        :host {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        button {
            display: block;
            padding: 0.5rem;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        button.active {
            color: red;
        }
    </style>
</template>
